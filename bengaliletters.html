<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bengali Letter Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-pink-100 to-blue-100 min-h-screen">

  <div class="text-center py-6">
    <h1 class="text-3xl font-bold text-purple-700">বাংলা বর্ণ শেখা</h1>
    </div>

  <div class="max-w-5xl mx-auto grid grid-cols-3 sm:grid-cols-5 md:grid-cols-7 gap-4 p-4">

    <!-- Bengali Letters -->
    <script>
      const letters = [
        "অ","আ","ই","ঈ","উ","ঊ","ঋ","এ","ঐ","ও","ঔ",
        "ক","খ","গ","ঘ","ঙ",
        "চ","ছ","জ","ঝ","ঞ",
        "ট","ঠ","ড","ঢ","ণ",
        "ত","থ","দ","ধ","ন",
        "প","ফ","ব","ভ","ম",
        "য","র","ল","শ","ষ","স","হ","ড়","ঢ়","য়"
      ];

      function speak(text){
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "bn-IN";
        speechSynthesis.speak(msg);
      }

      document.write(
        letters.map(l => `
          <button 
            onclick="speak('${l}')"
            class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-md hover:shadow-xl hover:bg-purple-200 transition rounded-2xl text-2xl font-bold p-6 text-purple-700">
            ${l}
          </button>
        `).join("")
      );
    </script>

  </div>

  <div class="text-center mt-10 text-gray-500">
    Made for Bengali learning ❤️
  </div>

</body>
</html>
