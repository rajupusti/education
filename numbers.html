<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Numbers for Kids</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#87CEEB,#FFD700);
    text-align:center;
}

h1{
    color:#ff0066;
    margin-top:20px;
}

p{
    font-size:20px;
    color:#333;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    padding:40px;
}

.number{
    width:120px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    font-weight:bold;
    color:white;
    border-radius:20px;
    cursor:pointer;
    transition:transform .2s;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.number:hover{
    transform:scale(1.1);
}

.footer{
    font-size:24px;
    margin:20px;
    color:#333;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🌟 Learn Numbers 🌟</h1>

<div class="container" id="numbers"></div>


<script>
const nums = [
    {n:"1", word:"one", c:"#FF5733"},
    {n:"2", word:"two", c:"#33C1FF"},
    {n:"3", word:"three", c:"#28B463"},
    {n:"4", word:"four", c:"#8E44AD"},
    {n:"5", word:"five", c:"#F39C12"},
    {n:"6", word:"six", c:"#E74C3C"},
    {n:"7", word:"seven", c:"#16A085"},
    {n:"8", word:"eight", c:"#D35400"},
    {n:"9", word:"nine", c:"#2E86C1"},
    {n:"0", word:"zero", c:"#FF1493"}
];

const container = document.getElementById("numbers");

nums.forEach(item=>{
    const div = document.createElement("div");
    div.className = "number";
    div.style.background = item.c;
    div.textContent = item.n;

    div.onclick = ()=>{
        const speech = new SpeechSynthesisUtterance(item.word);
        speech.rate = 0.8;
        speech.pitch = 1.4;
        speech.lang = "en-US";

        speechSynthesis.cancel(); // stop previous sound
        speechSynthesis.speak(speech);
    };

    container.appendChild(div);
});
</script>

</body>
</html>
