<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Click Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Comic+Neue:wght@700&display=swap');
        
        .letter-card {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .letter-card:hover {
            transform: scale(1.1);
        }
        
        .back {
            display: none;
        }
        
        .letter-card.active .front {
            display: none;
        }
        
        .letter-card.active .back {
            display: block;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-100 via-pink-100 to-blue-100 min-h-screen py-10">
    <div class="max-w-6xl mx-auto px-4">
        <div class="text-center mb-12">
            <h1 class="text-6xl font-bold bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent">
                Click the Letter!
            </h1>
            <p class="text-xl text-gray-600 mt-3">Click any letter to see the picture + hear the sound</p>
        </div>

        <div id="grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-6">
            <!-- Cards generated by JS -->
        </div>

        <div class="text-center mt-12">
            <button onclick="resetAll()" 
                    class="bg-white px-8 py-4 rounded-3xl text-xl font-semibold shadow-lg hover:shadow-xl transition-all flex items-center gap-3 mx-auto">
                <i class="fa-solid fa-rotate-right"></i>
                Reset All
            </button>
        </div>
    </div>

    <script>
        const alphabetData = [
            { letter: "A", word: "Apple", emoji: "🍎", image: "https://picsum.photos/id/1080/400/400" },
            { letter: "B", word: "Ball", emoji: "🏀", image: "https://picsum.photos/id/201/400/400" },
            { letter: "C", word: "Cat", emoji: "🐱", image: "https://picsum.photos/id/237/400/400" },
            { letter: "D", word: "Dog", emoji: "🐶", image: "https://picsum.photos/id/180/400/400" },
            { letter: "E", word: "Elephant", emoji: "🐘", image: "https://picsum.photos/id/1015/400/400" },
            { letter: "F", word: "Fish", emoji: "🐟", image: "https://picsum.photos/id/251/400/400" },
            { letter: "G", word: "Giraffe", emoji: "🦒", image: "https://picsum.photos/id/1016/400/400" },
            { letter: "H", word: "House", emoji: "🏠", image: "https://picsum.photos/id/133/400/400" },
            { letter: "I", word: "Ice Cream", emoji: "🍦", image: "https://picsum.photos/id/292/400/400" },
            { letter: "J", word: "Juice", emoji: "🧃", image: "https://picsum.photos/id/312/400/400" },
            { letter: "K", word: "Kangaroo", emoji: "🦘", image: "https://picsum.photos/id/201/400/400" },
            { letter: "L", word: "Lion", emoji: "🦁", image: "https://picsum.photos/id/1018/400/400" },
            { letter: "M", word: "Monkey", emoji: "🐵", image: "https://picsum.photos/id/1074/400/400" },
            { letter: "N", word: "Nest", emoji: "🪹", image: "https://picsum.photos/id/133/400/400" },
            { letter: "O", word: "Octopus", emoji: "🐙", image: "https://picsum.photos/id/251/400/400" },
            { letter: "P", word: "Penguin", emoji: "🐧", image: "https://picsum.photos/id/1015/400/400" },
            { letter: "Q", word: "Queen", emoji: "👑", image: "https://picsum.photos/id/201/400/400" },
            { letter: "R", word: "Rabbit", emoji: "🐰", image: "https://picsum.photos/id/237/400/400" },
            { letter: "S", word: "Sun", emoji: "☀️", image: "https://picsum.photos/id/1016/400/400" },
            { letter: "T", word: "Tiger", emoji: "🐯", image: "https://picsum.photos/id/180/400/400" },
            { letter: "U", word: "Umbrella", emoji: "☂️", image: "https://picsum.photos/id/133/400/400" },
            { letter: "V", word: "Violin", emoji: "🎻", image: "https://picsum.photos/id/312/400/400" },
            { letter: "W", word: "Whale", emoji: "🐳", image: "https://picsum.photos/id/1015/400/400" },
            { letter: "X", word: "Xylophone", emoji: "🎼", image: "https://picsum.photos/id/201/400/400" },
            { letter: "Y", word: "Yak", emoji: "🐃", image: "https://picsum.photos/id/1074/400/400" },
            { letter: "Z", word: "Zebra", emoji: "🦓", image: "https://picsum.photos/id/1018/400/400" }
        ];

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.1;
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = `letter-card bg-white rounded-3xl shadow-2xl overflow-hidden cursor-pointer aspect-square flex items-center justify-center relative`;

            card.innerHTML = `
                <!-- Front: Only Letter -->
                <div class="front absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 text-white">
                    <span class="text-8xl font-black tracking-tighter drop-shadow-lg">${item.letter}</span>
                </div>

                <!-- Back: Image + Word -->
                <div class="back absolute inset-0 flex flex-col items-center justify-center p-6 bg-white">
                    <div class="w-48 h-48 rounded-2xl overflow-hidden shadow-inner border-4 border-white mb-6">
                        <img src="${item.image}" alt="${item.word}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex items-center gap-3 text-3xl font-bold text-gray-800">
                        <span>${item.emoji}</span>
                        <span>${item.word}</span>
                    </div>
                    <div class="mt-4 text-indigo-600">
                        <i class="fa-solid fa-volume-high text-3xl"></i>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => {
                if (!card.classList.contains('active')) {
                    card.classList.add('active');
                    speak(`${item.letter} for ${item.word}`);
                } else {
                    // Optional: Click again to go back to letter
                    card.classList.remove('active');
                }
            });

            return card;
        }

        function init() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            alphabetData.forEach(item => {
                const card = createCard(item);
                grid.appendChild(card);
            });
        }

        function resetAll() {
            init();
        }

        // Initialize
        window.onload = init;
    </script>
</body>
</html>
